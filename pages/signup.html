<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signUp page</title>
    <link rel="stylesheet" href="/pages/Styles/signup.css">
    <link rel="icon" type="image/png" href="../assets/image/favicon.png?v=2">
</head>
<body>
    <main>
        <section class="title">
            <h1>Welcome to  <br>Jadoo Travel agency...</h1>
            <div>
                <img src="/assets/image/travel-sign.webp" alt="" class="travelerIMG">
            </div>
        </section>
        <section class="form-container">
             <div>
                 <h2>Create Account Now!</h2>
               </div>
            <form action="index.html">
              
                <div class="form-group">
                    <label for=""> Full name</label>
                    <input type="text" name="" id=""  placeholder="Enter your full name" required >
                </div>
                <div class="form-group">
                    <label for=""> Email</label>
                    <input type="email" name="" id="" placeholder=" Enter Your email" required>
                </div>
                <div class="form-group">
                    <label for=""> Password </label>
                    <input type="password" name="" id="" placeholder="Enter your Password (8+ chars)" required>
                </div>
                <div class="form-group">
                    <label for="">User name</label>
                    <input type="text" name="" id="" placeholder=" User Name (6+ chars)">
                </div>
                <div class="form-group">
                    <label for="">Phone</label>
                    <input type="number" name="" id="" placeholder=" Enter your Phone Number start with countary code +">
                </div>
                <div>
                    <a href="/pages/login.html">have an account?</a>
                </div>
                <button type="submit" class="submitBTN">Sign Up</button>

            </form>
        </section>
    </main>
</body>
</html>
