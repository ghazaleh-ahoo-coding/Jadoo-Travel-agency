<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signUp page</title>
    <link rel="stylesheet" href="/pages/Styles/signup.css">
    <link rel="icon" type="image/png" href="../assets/image/favicon.png?v=2">
</head>
<body>
    <main>
        <section class="title">
            <h1>Welcome to  <br>Jadoo Travel agency...</h1>
            <div>
                <img src="/assets/image/travel-sign.webp" alt="" class="travelerIMG">
            </div>
        </section>
        <section class="form-container">
             <div>
                 <h2>Create Account Now!</h2>
               </div>
               <div class="error-container">
                <h3 id="error"></h3>
               </div>
            <form onsubmit="message(event)" novalidate>
              
                <div class="form-group">
                    <label for=""> Full name</label>
                    <input type="text" name="" id="Name"  placeholder="Enter your full name" required >
                </div>
                <div class="form-group">
                    <label for=""> Email</label>
                    <input type="email" name="" id="email" placeholder=" Enter Your email" required>
                </div>
                <div class="form-group">
                    <label for=""> Password </label>
                    <input type="password" name="" id="password" placeholder="Enter your Password (8+ chars)" required>
                </div>
                <div class="form-group">
                    <label for="">User name</label>
                    <input type="text" name="" id="userName" placeholder=" User Name (6+ chars)">
                </div>
                <div class="form-group">
                    <label for="">Phone</label>
                    <input type="number" name="" id="" placeholder=" Enter your Phone Number start with countary code +">
                </div>
                <div class="s">
                    <a href="/pages/login.html">have an account?</a>
                </div>
                <button type="submit" class="submitBTN">Sign Up</button>
               <div>
                 <button type="button" class="clearBTN" onclick=" clearForm()" id="clear">Clear Form</button>
               </div>

            </form>
        </section>
    </main>
     <script src="/pages/page.js"></script>
</body>
</html>
